<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="430">
  <defs>
    <!-- Soft Ambient Aurora Orbs (fade to 0 before edges so zero cutout!) -->
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#0a84ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5e5ce6" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#5e5ce6" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbASD" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Unc0ver Signature Pill & Emblem Gradients -->
    <linearGradient id="unc0verBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2333" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#111622" stop-opacity="0.58" />
    </linearGradient>
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0a84ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="shimmerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .orbFloat1 { animation: float1 9s ease-in-out infinite; }
      .orbFloat2 { animation: float2 11s ease-in-out infinite; }
      .btnGlow { animation: btnPulse 3.2s ease-in-out infinite; }
      .cursorBlink { animation: blink 1.1s steps(2, start) infinite; }
      .glassSweep { animation: sweepX 6s ease-in-out infinite; }
      @keyframes float1 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(28px, 14px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-24px, -16px); }
      }
      @keyframes btnPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.84; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes sweepX {
        0%, 100% { transform: translateX(-180px); opacity: 0; }
        50% { transform: translateX(380px); opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Seamless Transparent Canvas with Floating Ambient Auras -->
  <circle class="orbFloat1" cx="310" cy="200" r="220" fill="url(#orbBlue)" />
  <circle class="orbFloat2" cx="860" cy="215" r="230" fill="url(#orbIndigo)" />
  <circle cx="590" cy="250" r="190" fill="url(#orbASD)" />

  <!-- Main Unc0ver Frosted Glass Container (Blends into GitHub dark bg) -->
  <rect x="30" y="24" width="1140" height="382" rx="26" fill="url(#glassFill)" stroke="url(#glassStroke)" stroke-width="1.4" />
  <rect class="glassSweep" x="220" y="24" width="260" height="1.5" fill="url(#shimmerLine)" />

  <!-- Top iOS-style Header Strip -->
  <text x="64" y="64" class="sf" font-size="13" font-weight="600" fill="#8e8e93" letter-spacing="0.4">crjase // sovereign systems</text>
  <rect x="928" y="44" width="212" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="946" cy="58" r="4" fill="#10b981" />
  <text x="1040" y="62" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#e5e7eb">AU • AGE 19 • ASD-ALIGNED</text>

  <!-- Left Column: Unc0ver App Identity & Action Pill -->
  <rect x="64" y="92" width="76" height="76" rx="20" fill="url(#unc0verBlue)" />
  <text x="102" y="143" text-anchor="middle" class="sf" font-size="40" font-weight="800" fill="#ffffff">u0</text>

  <text x="160" y="128" class="sf" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">crjase</text>
  <text x="162" y="158" class="sf" font-size="16" font-weight="500" fill="#98989d">
    Hardened Linux • Embedded &amp; RF • Low-Level C++
  </text>

  <!-- iOS Control Center Style Status Toggles (2x2 Glass Pills) -->
  <rect x="64" y="192" width="212" height="58" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09" />
  <text x="82" y="216" class="sf" font-size="12" font-weight="600" fill="#98989d">Kernel</text>
  <text x="82" y="236" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">Arch Hardened</text>
  <rect x="224" y="210" width="36" height="20" rx="10" fill="#30d158" />
  <circle cx="250" cy="220" r="7.5" fill="#ffffff" />

  <rect x="290" y="192" width="212" height="58" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09" />
  <text x="308" y="216" class="sf" font-size="12" font-weight="600" fill="#98989d">RF &amp; Embedded</text>
  <text x="308" y="236" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">RP2040 • HackRF</text>
  <rect x="450" y="210" width="36" height="20" rx="10" fill="#0a84ff" />
  <circle cx="476" cy="220" r="7.5" fill="#ffffff" />

  <rect x="64" y="264" width="212" height="58" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09" />
  <text x="82" y="288" class="sf" font-size="12" font-weight="600" fill="#98989d">Sovereign AI</text>
  <text x="82" y="308" class="mono" font-size="12.5" font-weight="700" fill="#ffffff">C++ / llama.cpp</text>
  <rect x="224" y="282" width="36" height="20" rx="10" fill="#5e5ce6" />
  <circle cx="250" cy="292" r="7.5" fill="#ffffff" />

  <rect x="290" y="264" width="212" height="58" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.09" />
  <text x="308" y="288" class="sf" font-size="12" font-weight="600" fill="#98989d">Operator</text>
  <text x="308" y="308" class="mono" font-size="12.5" font-weight="700" fill="#10b981">Age 19 • AU</text>
  <rect x="450" y="282" width="36" height="20" rx="10" fill="#10b981" />
  <circle cx="476" cy="292" r="7.5" fill="#ffffff" />

  <!-- Unc0ver Signature Primary Action Pill -->
  <rect class="btnGlow" x="64" y="338" width="438" height="46" rx="16" fill="url(#unc0verBlue)" />
  <text x="283" y="366" text-anchor="middle" class="sf" font-size="15.5" font-weight="700" fill="#ffffff" letter-spacing="0.3">
    Operational • Zero-Cloud First Principles
  </text>

  <!-- Right Column: Unc0ver Live Exploit / Boot Log Card -->
  <rect x="530" y="92" width="610" height="292" rx="20" fill="#080b12" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="554" cy="116" r="5" fill="#ff453a" />
  <circle cx="572" cy="116" r="5" fill="#ffd60a" />
  <circle cx="590" cy="116" r="5" fill="#30d158" />
  <text x="612" y="120" class="mono" font-size="11.5" fill="#8e8e93">unc0ver_env — zsh — 80×24</text>
  <line x1="530" y1="136" x2="1140" y2="136" stroke="#ffffff" stroke-opacity="0.07" />

  <text x="552" y="166" class="mono" font-size="13" fill="#8e8e93">[*] Initializing operator profile: crjase (age=19, region=AU)</text>
  <text x="552" y="194" class="mono" font-size="13" fill="#0a84ff">[+] Kernel: Arch linux-hardened + Hyprland verified</text>
  <text x="552" y="222" class="mono" font-size="13" fill="#30d158">[+] Infra: Debian 13 VPS • Nginx • Syncthing • SFTPGo</text>
  <text x="552" y="250" class="mono" font-size="13" fill="#5e5ce6">[+] Hardware: RP2040 Pico SDK • HackRF One • Flipper Zero</text>
  <text x="552" y="278" class="mono" font-size="13" fill="#64d2ff">[+] Core ML: Custom C++ Tensor/Backprop + llama-server</text>
  <text x="552" y="306" class="mono" font-size="13" fill="#ffd60a">[!] Filter: AI-assisted Rust/Svelte repos excluded from stats</text>
  <text x="552" y="344" class="mono" font-size="13" fill="#ffffff">[+] Ready. Standing by for ASD / Defence cyber &amp; systems.</text>
  <rect class="cursorBlink" x="1032" y="331" width="8" height="16" rx="2" fill="#0a84ff" />
</svg>