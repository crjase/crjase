  <rect x="22" y="270" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="22" y="270" width="372" height="4" rx="2" fill="url(#gAmber)" />
  <text x="42" y="302" class="mono" font-size="12" font-weight="700" fill="#f59e0b">04 // NETWORK &amp; OPSEC</text>
  <rect x="304" y="286" width="72" height="22" rx="11" fill="#78350f" />
  <text x="340" y="301" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#fcd34d">NET-SEC</text>
  <text x="42" y="336" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Protocol &amp; Privacy Tooling</text>
  <text x="42" y="362" class="sans" font-size="13" fill="#94a3b8">IPv4/IPv6 ARP &amp; NDP packet utilities,</text>
  <text x="42" y="382" class="sans" font-size="13" fill="#94a3b8">self-hosted DDNS &amp; encrypted comms.</text>
  <text x="42" y="418" class="mono" font-size="11.5" fill="#64748b">JJ-Spoofer • OpenChatServer • DDNS</text>
  <rect x="42" y="446" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="42" y="446" width="302" height="8" rx="4" fill="url(#gAmber)" />
  <text x="42" y="474" class="mono" font-size="11" fill="#fbbf24">READINESS: 92%</text>

  <!-- Row 2, Card 5: Physical-to-Digital Security -->
  <rect x="414" y="270" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="414" y="270" width="372" height="4" rx="2" fill="url(#gBlue)" />
  <text x="434" y="302" class="mono" font-size="12" font-weight="700" fill="#38bdf8">05 // PHYSICAL SECURITY</text>
  <rect x="684" y="286" width="84" height="22" rx="11" fill="#0c4a6e" />
  <text x="726" y="301" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8">APPLIED</text>
  <text x="434" y="336" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Access Control &amp; IP Video</text>
  <text x="434" y="362" class="sans" font-size="13" fill="#94a3b8">Hands-on electrical assembly, cabling,</text>
  <text x="434" y="382" class="sans" font-size="13" fill="#94a3b8">security hardware &amp; network CCTV.</text>
  <text x="434" y="418" class="mono" font-size="11.5" fill="#64748b">Field Diagnostics • Hardware Wiring</text>
  <rect x="434" y="446" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="434" y="446" width="284" height="8" rx="4" fill="url(#gBlue)" />
  <text x="434" y="474" class="mono" font-size="11" fill="#38bdf8">READINESS: 86%</text>

  <!-- Row 2, Card 6: Audio DSP & Signal Labs -->
  <rect x="806" y="270" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="806" y="270" width="372" height="4" rx="2" fill="url(#gIndigo)" />
  <text x="826" y="302" class="mono" font-size="12" font-weight="700" fill="#c084fc">06 // AUDIO DSP &amp; LABS</text>
  <rect x="1088" y="286" width="72" height="22" rx="11" fill="#312e81" />
  <text x="1124" y="301" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#d8b4fe">R&amp;D</text>
  <text x="826" y="336" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Low-Latency Audio &amp; Stems</text>
  <text x="826" y="362" class="sans" font-size="13" fill="#94a3b8">REAPER, Bitwig Studio on Arch Linux,</text>
  <text x="826" y="382" class="sans" font-size="13" fill="#94a3b8">Demucs stem separation &amp; DSP pipelines.</text>
  <text x="826" y="418" class="mono" font-size="11.5" fill="#64748b">Signal Isolation • Rapid Prototyping</text>
  <rect x="826" y="446" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="826" y="446" width="276" height="8" rx="4" fill="url(#gIndigo)" />
  <text x="826" y="474" class="mono" font-size="11" fill="#c084fc">READINESS: 84%</text>
