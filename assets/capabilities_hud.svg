  <rect x="806" y="22" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="806" y="22" width="372" height="4" rx="2" fill="url(#gIndigo)" />
  <text x="826" y="54" class="mono" font-size="12" font-weight="700" fill="#818cf8">03 // LOW-LEVEL &amp; LOCAL AI</text>
