  </defs>

  <circle cx="600" cy="105" r="240" fill="url(#tOrb)" />
  <rect x="30" y="16" width="1140" height="178" rx="22" fill="url(#tGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />

  <text x="56" y="48" class="sf" font-size="14" font-weight="700" fill="#ffffff">Telemetry Integrity // AI-Filtered Core Metrics</text>
