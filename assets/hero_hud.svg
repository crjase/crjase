<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030508" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0a1122" />
    </linearGradient>
    <linearGradient id="uncoverBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00a8ff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00a8ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .pulse { animation: pulseA 2s ease-in-out infinite; }
      .sweep { transform-origin: 995px 185px; animation: spin 6s linear infinite; }
      .ringPulse { transform-origin: 995px 185px; animation: ringExpand 3s ease-out infinite; }
      .bar1 { animation: eq1 1.4s ease-in-out infinite; transform-origin: bottom; }
      .bar2 { animation: eq2 1.1s ease-in-out infinite; transform-origin: bottom; }
      .bar3 { animation: eq3 1.6s ease-in-out infinite; transform-origin: bottom; }
      .bar4 { animation: eq4 1.25s ease-in-out infinite; transform-origin: bottom; }
      @keyframes pulseA { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ringExpand {
        0% { transform: scale(0.45); opacity: 0.8; }
        100% { transform: scale(1.15); opacity: 0; }
      }
      @keyframes eq1 { 0%, 100% { height: 14px; y: 344px; } 50% { height: 28px; y: 330px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; y: 334px; } 50% { height: 10px; y: 348px; } }
      @keyframes eq3 { 0%, 100% { height: 18px; y: 340px; } 50% { height: 30px; y: 328px; } }
      @keyframes eq4 { 0%, 100% { height: 28px; y: 330px; } 50% { height: 14px; y: 344px; } }
    </style>
  </defs>

  <!-- Background & Ambient Glows -->
  <rect width="1200" height="420" rx="20" fill="url(#bg)" />
  <circle cx="180" cy="90" r="220" fill="url(#orb1)" />
  <circle cx="980" cy="140" r="240" fill="url(#orb2)" />
  <circle cx="620" cy="370" r="190" fill="url(#orb3)" />
  <rect x="1.5" y="1.5" width="1197" height="417" rx="19" fill="none" stroke="url(#glassBorder)" stroke-width="1.8" />

  <!-- Top Unc0ver-style App Bar -->
  <rect x="28" y="22" width="1144" height="44" rx="12" fill="#0f1523" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
  <circle class="pulse" cx="52" cy="44" r="5.5" fill="#10b981" />
  <text x="68" y="49" class="mono" font-size="13" font-weight="700" fill="#10b981" letter-spacing="1.2">ROOT_ENV // OPERATIONAL</text>
  <text x="330" y="49" class="mono" font-size="12" fill="#94a3b8">CALLSIGN: CRJASE</text>
  <text x="530" y="49" class="mono" font-size="12" fill="#38bdf8" font-weight="700">AGE: 19</text>
  <text x="650" y="49" class="mono" font-size="12" fill="#94a3b8">THEATRE: AUSTRALIA (AU)</text>
  <rect x="978" y="31" width="176" height="26" rx="13" fill="#1e293b" />
  <text x="1066" y="48" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#e2e8f0">v2.6 // SPEC-OPS HUD</text>

  <!-- Left Hero Title & Unc0ver Console -->
  <rect x="28" y="84" width="760" height="252" rx="18" fill="#0c1220" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2" />

  <!-- Squircle App Icon Emblem -->
  <rect x="48" y="104" width="66" height="66" rx="16" fill="url(#uncoverBtn)" />
  <text x="81" y="149" text-anchor="middle" class="mono" font-size="34" font-weight="800" fill="#ffffff">C_</text>

  <text x="132" y="138" class="sans" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">CRJASE</text>
  <text x="134" y="164" class="mono" font-size="13.5" font-weight="600" fill="#38bdf8" letter-spacing="1.2">
    SOVEREIGN SYSTEMS  •  RF &amp; EMBEDDED  •  CYBER ENGINEERING
  </text>

  <!-- Live Jailbreak-Style Terminal Console -->
  <rect x="48" y="186" width="720" height="132" rx="12" fill="#05080f" stroke="#1e293b" stroke-width="1.2" />
  <text x="64" y="210" class="mono" font-size="12.5" fill="#64748b">[*] init_operator(handle="crjase", age=19, region="AU")</text>
  <text x="64" y="232" class="mono" font-size="12.5" fill="#10b981">[+] kernel_state: Arch linux-hardened + Hyprland [VERIFIED]</text>
  <text x="64" y="254" class="mono" font-size="12.5" fill="#38bdf8">[+] hw_rf_bus: RP2040 Pico SDK + HackRF One SDR + Flipper Zero</text>
  <text x="64" y="276" class="mono" font-size="12.5" fill="#818cf8">[+] sovereign_ai: Custom C++ Tensors + Offline llama-server</text>
  <text x="64" y="298" class="mono" font-size="12.5" fill="#f59e0b">[!] telemetry_filter: AI-assisted Rust/Svelte repos excluded</text>

  <!-- Bottom Unc0ver Action Pill Bar -->
  <rect x="28" y="352" width="330" height="44" rx="22" fill="url(#uncoverBtn)" />
  <text x="193" y="379" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.8">STATUS: READY FOR TASKING</text>

  <rect x="374" y="352" width="130" height="44" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
  <text x="439" y="379" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#38bdf8">AGE // 19</text>

  <rect x="518" y="352" width="135" height="44" rx="14" fill="#111827" stroke="#1e293b" stroke-width="1.2" />
  <text x="585" y="379" text-anchor="middle" class="mono" font-size="13" font-weight="600" fill="#e2e8f0">C++20 / C</text>

  <rect x="667" y="352" width="121" height="44" rx="14" fill="#111827" stroke="#10b981" stroke-width="1.2" />
  <text x="727" y="379" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#10b981">ZERO-CLOUD</text>

  <!-- Right Side Tactical Radar + Spectrum Card -->
  <rect x="810" y="84" width="362" height="312" rx="18" fill="#0c1220" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.2" />
  <text x="832" y="112" class="mono" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">SIGINT // RF SPECTRUM</text>

  <circle cx="995" cy="185" r="90" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="995" cy="185" r="58" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="995" cy="185" r="28" fill="none" stroke="#1e293b" stroke-width="1" />
  <circle class="ringPulse" cx="995" cy="185" r="88" fill="none" stroke="#00a8ff" stroke-width="1.5" />
  <line x1="898" y1="185" x2="1092" y2="185" stroke="#1e293b" stroke-width="1" />
  <line x1="995" y1="88" x2="995" y2="282" stroke="#1e293b" stroke-width="1" />

  <g class="sweep">
    <path d="M 995 185 L 995 95 A 90 90 0 0 1 1068 132 Z" fill="#00a8ff" fill-opacity="0.22" />
    <line x1="995" y1="185" x2="995" y2="95" stroke="#38bdf8" stroke-width="2.2" />
  </g>
  <circle class="pulse" cx="1034" cy="146" r="4.5" fill="#38bdf8" />
  <circle class="pulse" cx="955" cy="218" r="4" fill="#10b981" />
  <circle cx="995" cy="185" r="4.5" fill="#ffffff" />

  <!-- Animated Equalizer / Signal Bars -->
  <text x="832" y="348" class="mono" font-size="11.5" fill="#94a3b8">RF LOCK</text>
  <rect class="bar1" x="910" y="344" width="12" height="14" rx="3" fill="#00a8ff" />
  <rect class="bar2" x="928" y="334" width="12" height="24" rx="3" fill="#3b82f6" />
  <rect class="bar3" x="946" y="340" width="12" height="18" rx="3" fill="#6366f1" />
  <rect class="bar4" x="964" y="330" width="12" height="28" rx="3" fill="#10b981" />
  <text x="1148" y="348" text-anchor="end" class="mono" font-size="11.5" font-weight="700" fill="#10b981">NOMINAL</text>
</svg>