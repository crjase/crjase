      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2333" stop-opacity="0.72" />
