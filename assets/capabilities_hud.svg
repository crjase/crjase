<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" height="470">
  <defs>
    <radialGradient id="cOrb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cOrb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2333" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#111622" stop-opacity="0.56" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#64d2ff" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
    <linearGradient id="barIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5e5ce6" />
      <stop offset="100%" stop-color="#bf5af2" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="100%" stop-color="#ffd60a" />
    </linearGradient>
    <style>
      .sf { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .drift { animation: driftA 10s ease-in-out infinite; }
      @keyframes driftA {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(20px, -12px); }
      }
    </style>
  </defs>

  <!-- Transparent Canvas + Soft Ambient Glows (No Cutout Box!) -->
  <circle class="drift" cx="320" cy="230" r="220" fill="url(#cOrb1)" />
  <circle cx="880" cy="250" r="220" fill="url(#cOrb2)" />

  <!-- Card 1 -->
  <rect x="30" y="20" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="54" y="54" class="sf" font-size="16" font-weight="700" fill="#ffffff">Hardened Systems</text>
  <rect x="302" y="36" width="72" height="24" rx="12" fill="#30d158" fill-opacity="0.18" />
  <text x="338" y="52" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#30d158">ACTIVE</text>
  <text x="54" y="84" class="sf" font-size="13.5" fill="#d1d5db">Arch (linux-hardened) • Hyprland</text>
  <text x="54" y="106" class="sf" font-size="13" fill="#98989d">Debian 13 VPS, Nginx, PHP-FPM,</text>
  <text x="54" y="126" class="sf" font-size="13" fill="#98989d">Syncthing, SFTPGo &amp; zero-cloud infra.</text>
  <rect x="54" y="164" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="54" y="164" width="298" height="7" rx="3.5" fill="url(#barBlue)" />
  <text x="54" y="196" class="mono" font-size="11.5" fill="#64d2ff">CMake • Cross-Compile • Shell Ops</text>

  <!-- Card 2 -->
  <rect x="417" y="20" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="441" y="54" class="sf" font-size="16" font-weight="700" fill="#ffffff">Embedded &amp; RF / SDR</text>
  <rect x="679" y="36" width="82" height="24" rx="12" fill="#0a84ff" fill-opacity="0.2" />
  <text x="720" y="52" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#64d2ff">FIELD</text>
  <text x="441" y="84" class="sf" font-size="13.5" fill="#d1d5db">RP2040 Pico SDK • AVR / Arduino</text>
  <text x="441" y="106" class="sf" font-size="13" fill="#98989d">HackRF One + PortaPack Mayhem,</text>
  <text x="441" y="126" class="sf" font-size="13" fill="#98989d">Flipper Zero &amp; SMD hardware work.</text>
  <rect x="441" y="164" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="441" y="164" width="286" height="7" rx="3.5" fill="url(#barGreen)" />
  <text x="441" y="196" class="mono" font-size="11.5" fill="#30d158">SIGINT • Microcontrollers • Hardware</text>

  <!-- Card 3 -->
  <rect x="804" y="20" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="828" y="54" class="sf" font-size="16" font-weight="700" fill="#ffffff">C++ &amp; Sovereign AI</text>
  <rect x="1076" y="36" width="72" height="24" rx="12" fill="#5e5ce6" fill-opacity="0.24" />
  <text x="1112" y="52" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#bf5af2">CORE</text>
  <text x="828" y="84" class="sf" font-size="13.5" fill="#d1d5db">From-Scratch C++ Neural Nets</text>
  <text x="828" y="106" class="sf" font-size="13" fill="#98989d">Custom Tensor &amp; ReLU backprop,</text>
  <text x="828" y="126" class="sf" font-size="13" fill="#98989d">offline llama-server &amp; Qt/Android.</text>
  <rect x="828" y="164" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="828" y="164" width="280" height="7" rx="3.5" fill="url(#barIndigo)" />
  <text x="828" y="196" class="mono" font-size="11.5" fill="#bf5af2">C++20 • C • Python • Qt SDK</text>

  <!-- Card 4 -->
  <rect x="30" y="245" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="54" y="279" class="sf" font-size="16" font-weight="700" fill="#ffffff">Network &amp; OpSec</text>
  <rect x="294" y="261" width="80" height="24" rx="12" fill="#ff9f0a" fill-opacity="0.2" />
  <text x="334" y="277" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffd60a">NET-SEC</text>
  <text x="54" y="309" class="sf" font-size="13.5" fill="#d1d5db">Protocol &amp; Privacy Tooling</text>
  <text x="54" y="331" class="sf" font-size="13" fill="#98989d">IPv4/IPv6 ARP &amp; NDP utilities,</text>
  <text x="54" y="351" class="sf" font-size="13" fill="#98989d">self-hosted DDNS &amp; chat servers.</text>
  <rect x="54" y="389" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="54" y="389" width="292" height="7" rx="3.5" fill="url(#barAmber)" />
  <text x="54" y="421" class="mono" font-size="11.5" fill="#ffd60a">JJ-Spoofer • OpenChatServer • DDNS</text>

  <!-- Card 5 -->
  <rect x="417" y="245" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="441" y="279" class="sf" font-size="16" font-weight="700" fill="#ffffff">Physical Security</text>
  <rect x="679" y="261" width="82" height="24" rx="12" fill="#0a84ff" fill-opacity="0.2" />
  <text x="720" y="277" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#64d2ff">APPLIED</text>
  <text x="441" y="309" class="sf" font-size="13.5" fill="#d1d5db">Access Control &amp; IP Video</text>
  <text x="441" y="331" class="sf" font-size="13" fill="#98989d">Electrical assembly, cabling,</text>
  <text x="441" y="351" class="sf" font-size="13" fill="#98989d">security hardware &amp; CCTV nets.</text>
  <rect x="441" y="389" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="441" y="389" width="272" height="7" rx="3.5" fill="url(#barBlue)" />
  <text x="441" y="421" class="mono" font-size="11.5" fill="#64d2ff">Field Diagnostics • Hardware</text>

  <!-- Card 6 -->
  <rect x="804" y="245" width="366" height="205" rx="22" fill="url(#cGlass)" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.2" />
  <text x="828" y="279" class="sf" font-size="16" font-weight="700" fill="#ffffff">Audio DSP &amp; Labs</text>
  <rect x="1076" y="261" width="72" height="24" rx="12" fill="#5e5ce6" fill-opacity="0.24" />
  <text x="1112" y="277" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#bf5af2">R&amp;D</text>
  <text x="828" y="309" class="sf" font-size="13.5" fill="#d1d5db">Low-Latency Audio &amp; Stems</text>
  <text x="828" y="331" class="sf" font-size="13" fill="#98989d">REAPER, Bitwig on Arch Linux,</text>
  <text x="828" y="351" class="sf" font-size="13" fill="#98989d">Demucs stem separation pipelines.</text>
  <rect x="828" y="389" width="318" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08" />
  <rect x="828" y="389" width="266" height="7" rx="3.5" fill="url(#barIndigo)" />
  <text x="828" y="421" class="mono" font-size="11.5" fill="#bf5af2">Signal Isolation • Prototyping</text>
</svg>