<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="520">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#111829" />
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#04060b" stroke="#1e293b" stroke-width="1.5" />

  <!-- Row 1, Card 1: Systems & Hardened OS -->
  <rect x="22" y="22" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="22" y="22" width="372" height="4" rx="2" fill="url(#gBlue)" />
  <text x="42" y="54" class="mono" font-size="12" font-weight="700" fill="#38bdf8">01 // SYSTEMS &amp; HARDENED OS</text>
  <rect x="304" y="38" width="72" height="22" rx="11" fill="#064e3b" />
  <text x="340" y="53" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#34d399">ACTIVE</text>
  <text x="42" y="88" class="sans" font-size="15" font-weight="700" fill="#f8fafc">Arch (linux-hardened) &amp; Debian</text>
  <text x="42" y="114" class="sans" font-size="13" fill="#94a3b8">Hyprland, Nginx, PHP-FPM, Syncthing,</text>
  <text x="42" y="134" class="sans" font-size="13" fill="#94a3b8">SFTPGo, isolated VPS &amp; zero-cloud infra.</text>
  <text x="42" y="170" class="mono" font-size="11.5" fill="#64748b">CMake • Cross-Compile • Shell Ops</text>
  <rect x="42" y="198" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="42" y="198" width="308" height="8" rx="4" fill="url(#gBlue)" />
  <text x="42" y="226" class="mono" font-size="11" fill="#38bdf8">READINESS: 94%</text>

  <!-- Row 1, Card 2: Embedded, RF & Hardware -->
  <rect x="414" y="22" width="372" height="228" rx="16" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.2" />
  <rect x="414" y="22" width="372" height="4" rx="2" fill="url(#gGreen)" />
  <text x="434" y="54" class="mono" font-size="12" font-weight="700" fill="#10b981">02 // EMBEDDED &amp; RF / SDR</text>
  <rect x="684" y="38" width="84" height="22" rx="11" fill="#0c4a6e" />
  <text x="726" y="53" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8">FIELD-OPS</text>
  <text x="434" y="88" class="sans" font-size="15" font-weight="700" fill="#f8fafc">RP2040, HackRF One &amp; Flipper</text>
  <text x="434" y="114" class="sans" font-size="13" fill="#94a3b8">Raspberry Pi Pico SDK, AVR/Arduino,</text>
  <text x="434" y="134" class="sans" font-size="13" fill="#94a3b8">PortaPack Mayhem, RF &amp; SMD soldering.</text>
  <text x="434" y="170" class="mono" font-size="11.5" fill="#64748b">SIGINT • Microcontrollers • Hardware</text>
  <rect x="434" y="198" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="434" y="198" width="296" height="8" rx="4" fill="url(#gGreen)" />
  <text x="434" y="226" class="mono" font-size="11" fill="#10b981">READINESS: 90%</text>

