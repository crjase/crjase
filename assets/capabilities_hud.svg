  <text x="1124" y="53" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#a5b4fc">CORE</text>
  <text x="826" y="88" class="sans" font-size="15" font-weight="700" fill="#f8fafc">From-Scratch C++ Neural Nets</text>
  <text x="826" y="114" class="sans" font-size="13" fill="#94a3b8">Custom Tensor &amp; matrix ops, ReLU backprop,</text>
  <text x="826" y="134" class="sans" font-size="13" fill="#94a3b8">air-gapped llama-server &amp; agent workflows.</text>
  <text x="826" y="170" class="mono" font-size="11.5" fill="#64748b">C++20 • C • Python • Qt / Android</text>
  <rect x="826" y="198" width="330" height="8" rx="4" fill="#1e293b" />
  <rect x="826" y="198" width="290" height="8" rx="4" fill="url(#gIndigo)" />
  <text x="826" y="226" class="mono" font-size="11" fill="#a5b4fc">READINESS: 88%</text>

